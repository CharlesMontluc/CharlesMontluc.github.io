<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Charles Montluc-Giannopoulou</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v=20261128b">
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <style>
    .nf { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 8px; padding: 24px; }
    .nf h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(64px, 12vw, 132px); line-height: 1; margin: 0; }
    .nf p { color: var(--muted); margin: 0 0 28px; }
    .nf .code { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: .08em; margin: 0; }
  </style>
</head>
<body>
  <main class="nf">
    <p class="code">404</p>
    <h1>Σελίδα δεν βρέθηκε</h1>
    <p>That's Greek for “page not found”. This page doesn't exist.</p>
    <div><a class="btn btn-primary" href="/">Back to the homepage</a></div>
  </main>
</body>
</html>
